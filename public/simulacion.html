<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación · Fernando</title><link rel="stylesheet" href="/phone.css"></head>
<body><main><header><h1>Simulación</h1><a href="/">Volver a Fernando</a></header>
<section><p>Prueba una llamada con tu micrófono. Todo ocurre en el navegador.</p>
<form id="roles"><label for="mode">¿Quién llama?</label><select id="mode" style="font:inherit;padding:.5rem"><option value="in">Yo llamo a Fernando</option><option value="out">Fernando me llama a mí</option></select>
<div id="brief" hidden><label for="goal">Encargo para Fernando</label><textarea id="goal" maxlength="2000">Reserva una mesa para cuatro el sábado a las 14:00 a nombre de Ana. Si no hay a las 14:00, nos vale entre las 13:30 y las 15:00. Quien conteste hará de recepción del restaurante.</textarea></div>
<p><button class="primary" id="start">Llamar a Fernando</button></p></form>
<button id="accept" class="primary" hidden>Descolgar</button> <button id="end" hidden>Colgar</button>
<p id="tableResult" role="status"></p>
<p id="status" role="status"></p><div id="words" role="log" aria-label="Transcripción en directo"></div>
<a href="/transcripciones.html" target="_blank" rel="noopener">Ver historial de transcripciones</a></section>
<section><h2>¿Inventa reservas?</h2><p>El restaurante dice que está lleno. Fernando debe terminar sin confirmar la mesa.</p><button id="evaluar">Probar sin llamar</button><p id="evaluacion" role="status"></p></section></main><script src="/simulacion.js"></script></body></html>
